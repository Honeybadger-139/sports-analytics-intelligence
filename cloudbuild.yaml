steps:
  # Step 1: Run backend tests with the development dependency set.
  # (Skipped during manual build since DATABASE_URL is required)
  #- name: python:3.11-slim
  #  entrypoint: bash
  #  args:
  #    - -c
  #    - |
  #      cd backend && \
  #      pip install -r requirements-dev.txt -q && \
  #      PYTHONPATH=. pytest tests/ -q --tb=short
  #  allowExitCodes: [0, 1, 2]

  # ── API IMAGE ─────────────────────────────────────────────────────────────

  # Step 2: Build the API image from the production Dockerfile.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/api:latest",
        "-f",
        "backend/Dockerfile",
        "backend/",
      ]

  # Step 3: Push the API image to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "--all-tags",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/api",
      ]

  # Step 3.5: Run Alembic migrations before deploying (main branch only).
  # Creates/updates a dedicated migration Cloud Run Job using the freshly-built
  # API image (which has alembic + all deps installed), then executes it and waits.
  # Build fails here if migrations fail — preventing a broken schema reaching prod.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "main" ]; then
          gcloud run jobs update job-run-migrations \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/api:latest" \
            --region "${_REGION}" \
            --set-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --command "alembic" \
            --args "upgrade,head" \
            --quiet 2>/dev/null || \
          gcloud run jobs create job-run-migrations \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/api:latest" \
            --region "${_REGION}" \
            --service-account "gamethread-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --memory 1Gi \
            --cpu 1 \
            --task-timeout 300s \
            --set-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --update-secrets DATABASE_URL=DATABASE_URL:latest \
            --command "alembic" \
            --args "upgrade,head" \
            --quiet;
          gcloud run jobs execute job-run-migrations \
            --region "${_REGION}" \
            --wait \
            --quiet;
        fi

  # Step 4: Deploy to Cloud Run only from the main branch.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "main" ]; then
          gcloud run deploy gamethread-api \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/api:latest" \
            --region "${_REGION}" \
            --platform managed \
            --service-account "gamethread-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances 1 \
            --max-instances 5 \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 80 \
            --port 8000 \
            --timeout 3600s \
            --set-env-vars EMBEDDED_SCHEDULER_ENABLED=false,GCS_MODELS_BUCKET=gamethread-models,GCP_PROJECT_ID=${PROJECT_ID} \
            --add-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --update-secrets DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_BASE_URL=LANGFUSE_BASE_URL:latest,CHAT_API_KEY=CHAT_API_KEY:latest \
            --allow-unauthenticated \
            --quiet;
        fi

  # ── INGESTION IMAGE ───────────────────────────────────────────────────────

  # Step 5: Build the ingestion image.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/ingestion:latest",
        "-f",
        "backend/Dockerfile.ingestion",
        "backend/",
      ]

  # Step 6: Push the ingestion image.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "--all-tags",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/ingestion",
      ]

  # Step 7: Update the ingestion Cloud Run Job only from the main branch.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "main" ]; then
          gcloud run jobs update job-nba-raw-ingestion \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/ingestion:latest" \
            --region "${_REGION}" \
            --set-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --set-env-vars "GCP_PROJECT_ID=${PROJECT_ID},GCS_RAW_BUCKET=gamethread-raw,PUBSUB_PIPELINE_TOPIC=ingestion-complete" \
            --quiet || \
          gcloud run jobs create job-nba-raw-ingestion \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/ingestion:latest" \
            --region "${_REGION}" \
            --service-account "gamethread-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --memory 2Gi \
            --cpu 2 \
            --task-timeout 3600s \
            --set-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --set-env-vars "GCP_PROJECT_ID=${PROJECT_ID},GCS_RAW_BUCKET=gamethread-raw,PUBSUB_PIPELINE_TOPIC=ingestion-complete" \
            --update-secrets DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --quiet;
        fi

  # ── RAG IMAGE ─────────────────────────────────────────────────────────────

  # Step 8: Build the RAG refresh image.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/rag:latest",
        "-f",
        "backend/Dockerfile.rag",
        "backend/",
      ]

  # Step 9: Push the RAG refresh image.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "--all-tags",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/rag",
      ]

  # Step 10: Update the RAG Cloud Run Job only from the main branch.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "main" ]; then
          gcloud run jobs update job-rag-refresh \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/rag:latest" \
            --region "${_REGION}" \
            --set-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --quiet || \
          gcloud run jobs create job-rag-refresh \
            --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/rag:latest" \
            --region "${_REGION}" \
            --service-account "gamethread-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --memory 2Gi \
            --cpu 2 \
            --task-timeout 3600s \
            --set-cloudsql-instances "${PROJECT_ID}:${_REGION}:sports-analytics-pg" \
            --update-secrets DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_BASE_URL=LANGFUSE_BASE_URL:latest \
            --quiet;
        fi

  # ── PREFECT AGENT IMAGE ───────────────────────────────────────────────────

  # Step 11: Build the Prefect agent image.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/prefect-agent:latest",
        "-f",
        "backend/Dockerfile.prefect-agent",
        "backend/",
      ]

  # Step 12: Push the Prefect agent image.
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "--all-tags",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gamethread/prefect-agent",
      ]

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
