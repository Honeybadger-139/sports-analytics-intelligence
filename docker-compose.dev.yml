# ============================================================
# docker-compose.dev.yml — Development overrides
# ============================================================
# Extends docker-compose.base.yml with:
#   - pgAdmin for SQL exploration
#   - Grafana for dashboard development
#   - Backend code volume mount for fast manual restarts during development
#   - ChromaDB vector store (optional, commented out by default)
#
# Usage:
#   docker-compose -f docker-compose.base.yml -f docker-compose.dev.yml up
# ============================================================

services:
  backend:
    environment:
      LANGFUSE_ENABLED: "false"
      CHAT_ENGINE: ${CHAT_ENGINE:-legacy}
      LOG_LEVEL: DEBUG
      EMBEDDED_SCHEDULER_ENABLED: "true"
    volumes:
      - ./backend:/app   # live code sync for hot-reload

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sports-analytics-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sportsanalytics.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin2026}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sports-analytics-grafana
    restart: unless-stopped
    ports:
      - "3301:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  airflow:
    image: apache/airflow:2.9.3
    container_name: sports-analytics-airflow
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      GAMETHREAD_API_BASE_URL: ${GAMETHREAD_API_BASE_URL:-http://host.docker.internal:8000}
      GAMETHREAD_CHAT_API_KEY: ${GAMETHREAD_CHAT_API_KEY:-${CHAT_API_KEY}}
      GAMETHREAD_API_TIMEOUT_SECONDS: ${GAMETHREAD_API_TIMEOUT_SECONDS:-7200}
      GAMETHREAD_PIPELINE_INCLUDE_RAG: ${GAMETHREAD_PIPELINE_INCLUDE_RAG:-false}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-admin}
    command: bash -c "airflow standalone"
    ports:
      - "8088:8080"
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - ./infra/airflow/logs:/opt/airflow/logs
      - ./infra/airflow/plugins:/opt/airflow/plugins

  # ChromaDB Vector Store (uncomment to run locally instead of using embedded mode)
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: sports-analytics-vectordb
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma

volumes:
  pgadmin_data:
  grafana_data:
  # chroma_data:
